services:
  database:
    image: postgres:16-alpine
    container_name: space-postgres
    restart: always
    environment:
      POSTGRES_DB: orbital_db
      POSTGRES_USER: pilot
      POSTGRES_PASSWORD: SecretPassword123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: space-adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - database

volumes:
  pgdata:
